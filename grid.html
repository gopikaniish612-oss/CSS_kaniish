<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display:grid;
            grid-template-columns:auto auto auto;
            background-color:dodgerblue;
            padding:10px;
            column-gap: 25px;
            row-gap: 20px;
        }
        .container1 {
            display:grid;
            grid-template-columns:auto auto auto;
            background-color:dodgerblue;
            padding:10px;
            column-gap: 20px;
            row-gap: 20px;
        }
        .container div {
            background-color:#f1f1f1;
            border:1px solid rgba(32, 30, 30, 0.8);
            padding:10px;
            text-align:center;
        }
        .container1 div{
            background-color:#f1f1f1;
            border:1px solid rgba(32, 30, 30, 0.8);
            padding:10px;
            text-align:center;
        }
        .container2 {
            display:grid;
            grid-template-columns:80px 200px auto;
            background-color:dodgerblue;
            padding:10px;
        }
        container2 div {
            background-color:#f1f1f1;
            border:1px solid rgba(32, 30, 30, 0.8);
            padding:10px;
            text-align:center;
           
        }
        </style>
</head>
<body>
    <h1>grid layer</h1>
    <p>a grid layer with 5 containers</p>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
    <p>a grid layer with 5 containers</p>
    <div class="container1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
    <p>a grid layer with 6 containers</p>
    <div class="container2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>
