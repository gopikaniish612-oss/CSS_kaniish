<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            background-color:dodgerblue;
        }
        .container div{
            background-color:#f1f1f1;
            margin:10px;
            padding:20px;
            font-size:24px;

        }
        .container1{
            display:flex;
            flex-direction:column;
            background-color:rgb(224, 8, 8);
        }
         .container1 div{
            background-color:#401fe6;
            margin:10px;
            padding:20px;
            font-size:24px;

        }
    </style>
</head>
<body>
    <h1> create a flex container</h1>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        
    </div>
    <h1> create a flex container with 8 items    </h1>
    <div class="container1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
    </div>  
    <p>
flexbox must have a parent element with the display property</p>
</body>
</html>
